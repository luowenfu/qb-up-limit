<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<script>
try { if (localStorage.getItem('qb-scheme') === 'dark') document.documentElement.dataset.scheme = 'dark'; } catch (e) {}
</script>
<title>qB 达量限速管理</title>
<link rel="icon" href="/favicon.ico" sizes="64x64">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/cards.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/dialogs.css">
<link rel="stylesheet" href="/static/css/mobile.css">
<link rel="stylesheet" href="/static/css/extra.css">
<link rel="stylesheet" href="/static/css/scheme.css">
</head>
<body data-view="qb" data-theme="qb">

<div class="shell">
    <aside class="sidebar" aria-label="侧边栏">
        <button type="button" class="side-toggle" id="sideBtn" aria-label="收起侧栏" aria-expanded="true">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3" width="15" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v14" stroke="currentColor" stroke-width="1.6"/><path d="M13.2 7.5 10.2 10l3 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="brand">
            <img class="brand-logo" src="/static/img/favicon.svg" alt="" width="40" height="40">
            <div>
                <div class="brand-title"><span title="qB 达量限速管理">qB 达量限速管理</span><a class="brand-gh" href="https://github.com/luowenfu/qb-up-limit" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 打开" title="在 GitHub 打开"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a></div>
                <div class="brand-sub">
                    <span>流量监控 · 自动限速</span>
                    <span class="ver" id="ver">v1.84.18</span>
                </div>
            </div>
        </div>

        <button type="button" class="add-btn" data-open="add">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>添加设备</span>
        </button>

        <div class="nav-label">设备管理</div>
        <nav class="nav nav-tree" id="navTree" aria-label="设备"></nav>

        <div class="nav-line"></div>
        <nav class="nav">
            <button type="button" class="nav-item" id="themeBtn" aria-pressed="false">
                <span class="theme-ico" aria-hidden="true">
                    <svg class="ico-sun" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3.1" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.4v1.7M10 15.9v1.7M2.4 10h1.7M15.9 10h1.7M4.6 4.6l1.2 1.2M14.2 14.2l1.2 1.2M4.6 15.4l1.2-1.2M14.2 5.8l1.2-1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    <svg class="ico-moon" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M16.4 12.2A6.5 6.5 0 0 1 7.6 3.6 6.6 6.6 0 1 0 16.4 12.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                </span>
                <span class="grow">主题切换</span>
                <span class="nav-badge" id="themeMark"></span>
            </button>
            <button type="button" class="nav-item" data-nav="syslogs">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span class="grow">系统日志</span>
            </button>
            <button type="button" class="nav-item" data-open="settings">
                <svg class="gear" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="grow">全局设置</span>
            </button>
        </nav>

        <div class="status">
            <div class="ring">
                <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15.5" fill="none" stroke-width="3"/><circle class="bar" id="ringBar" cx="18" cy="18" r="15.5" fill="none" stroke-width="3" stroke-dasharray="97.4" stroke-dashoffset="0"/></svg>
                <span id="ringSec">5</span>
                <i id="liveDot"></i>
            </div>
            <div class="status-meta">
                <b>自动刷新</b>
                <small class="num" id="clock">--</small>
            </div>
            <button type="button" class="logout" title="退出登录" aria-label="退出登录">
                <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8M12.5 6.5 16 10l-3.5 3.5M16 10H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
        <header class="topbar">
            <div class="topbar-in">
                <div class="tb-bar">
                    <button type="button" class="icon-btn" id="menuBtn" aria-label="打开菜单">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </button>
                    <button type="button" class="icon-btn" id="backBtn" aria-label="返回设备列表" hidden>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5 7 10l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <div class="tb-title">
                        <i class="tb-mark" aria-hidden="true"></i>
                        <h1 class="title" id="title">设备</h1>
                        <span class="kind" id="kind" hidden>qB</span>
                    </div>
                </div>
                <div class="tb-metrics-slot" id="metricsSlot">
                    <button type="button" class="tb-split" id="metricsSplit" aria-expanded="true" aria-controls="pills" aria-label="收起状态栏" title="收起状态栏">
                        <i class="tb-split-line" aria-hidden="true"></i>
                        <span class="tb-split-grip" aria-hidden="true">
                            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M6.2 2.2 3.4 5l2.8 2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </button>
                    <div class="tb-metrics-clip">
                        <div class="tb-metrics" id="pills"></div>
                    </div>
                </div>
            </div>
        </header>

        <div class="page">
            <div id="content"></div>
        </div>
    </div>
</div>

<nav class="detail-tabs" id="detailTabs" aria-label="设备详情">
    <button type="button" data-detail-tab="card"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3.5" width="14" height="5.5" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="11" width="14" height="5.5" rx="1.6" stroke="currentColor" stroke-width="1.7"/><circle cx="6.3" cy="6.25" r=".9" fill="currentColor"/><circle cx="6.3" cy="13.75" r=".9" fill="currentColor"/></svg>设备详情</button>
    <button type="button" data-detail-tab="events"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>事件记录</button>
    <button type="button" data-detail-tab="chart"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 16V10M7.5 16V5M12 16V8.5M16.5 16V3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>流量图表</button>
</nav>
<nav class="bottom-bar">
    <button type="button" data-bar="devices"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 17h6M10 14v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>设备</button>
    <button type="button" data-bar="syslogs"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>日志</button>
    <button type="button" data-open="settings"><svg class="gear" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>设置</button>
</nav>

<div class="modal-mask" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="sheet-mask" id="sheetMask"></div>
<aside class="sheet" id="sheet" aria-label="设置面板"></aside>
<div class="toasts" id="toasts"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
